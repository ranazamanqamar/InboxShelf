<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3800" viewBox="0 0 2400 3800" role="img" aria-label="InboxShelf complete product flow">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#1e293b"/>
    </marker>
    <style type="text/css"><![CDATA[
      .title { font: 700 44px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px Segoe UI, Arial, sans-serif; fill: #475569; }
      .section { font: 700 26px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .h { font: 700 22px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .t { font: 600 20px Segoe UI, Arial, sans-serif; fill: #1e293b; }
      .small { font: 400 17px Segoe UI, Arial, sans-serif; fill: #334155; }
      .or { font: 600 18px Segoe UI, Arial, sans-serif; fill: #64748b; }
      .lane { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 16; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 2.5; rx: 12; }
      .boxAccent { fill: #f8fafc; stroke: #0f172a; stroke-width: 3; rx: 12; }
      .boxTrial { fill: #ecfdf5; stroke: #047857; stroke-width: 3; rx: 12; }
      .boxPay { fill: #fff7ed; stroke: #c2410c; stroke-width: 3; rx: 12; }
      .boxDash { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; rx: 12; }
      .line { stroke: #1e293b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    ]]></style>
  </defs>

  <rect width="2400" height="3800" fill="#ffffff"/>

  <text x="1200" y="70" text-anchor="middle" class="title">InboxShelf - Complete Product Flow</text>
  <text x="1200" y="110" text-anchor="middle" class="subtitle">Landing to Auth to 14-day free trial (no card) to Dashboard to Day 14 paywall</text>

  <!-- 1 Landing -->
  <rect class="lane" x="60" y="150" width="2280" height="220"/>
  <text x="90" y="195" class="section">1. Landing</text>
  <rect class="boxAccent" x="700" y="220" width="1000" height="110"/>
  <text x="1200" y="270" text-anchor="middle" class="h">inboxshelf.com  |  Home /</text>
  <text x="1200" y="305" text-anchor="middle" class="small">Features | Workflow | FAQ | Pricing (Starter trial / Pro $10)</text>

  <line class="line" x1="1200" y1="370" x2="1200" y2="430"/>

  <!-- 2 Auth -->
  <rect class="lane" x="60" y="440" width="2280" height="560"/>
  <text x="90" y="485" class="section">2. Signup or Login</text>

  <rect class="box" x="280" y="520" width="320" height="70"/>
  <text x="440" y="565" text-anchor="middle" class="t">New user?</text>

  <rect class="box" x="1800" y="520" width="320" height="70"/>
  <text x="1960" y="565" text-anchor="middle" class="t">Already have account?</text>

  <path class="line" d="M1200,430 L1200,470"/>
  <path class="line" d="M1200,470 H440"/>
  <line class="line" x1="440" y1="470" x2="440" y2="520"/>
  <path class="line" d="M1200,470 H1960"/>
  <line class="line" x1="1960" y1="470" x2="1960" y2="520"/>

  <rect class="boxAccent" x="140" y="640" width="600" height="280"/>
  <text x="440" y="685" text-anchor="middle" class="h">/signup</text>
  <rect class="box" x="190" y="710" width="500" height="60"/>
  <text x="440" y="750" text-anchor="middle" class="t">Email + Password</text>
  <text x="440" y="800" text-anchor="middle" class="or">- or -</text>
  <rect class="box" x="190" y="820" width="500" height="60"/>
  <text x="440" y="860" text-anchor="middle" class="t">Sign up with Google</text>

  <rect class="boxAccent" x="1660" y="640" width="600" height="280"/>
  <text x="1960" y="685" text-anchor="middle" class="h">/login</text>
  <rect class="box" x="1710" y="710" width="500" height="60"/>
  <text x="1960" y="750" text-anchor="middle" class="t">Email + Password</text>
  <text x="1960" y="800" text-anchor="middle" class="or">- or -</text>
  <rect class="box" x="1710" y="820" width="500" height="60"/>
  <text x="1960" y="860" text-anchor="middle" class="t">Continue with Google</text>

  <line class="line" x1="440" y1="590" x2="440" y2="640"/>
  <line class="line" x1="1960" y1="590" x2="1960" y2="640"/>
  <line class="line" x1="440" y1="920" x2="440" y2="1020"/>
  <line class="line" x1="1960" y1="920" x2="1960" y2="1020"/>
  <path class="line" d="M440,1020 H1200"/>
  <path class="line" d="M1960,1020 H1200"/>
  <line class="line" x1="1200" y1="1020" x2="1200" y2="1080"/>

  <!-- 3 Trial -->
  <rect class="lane" x="60" y="1090" width="2280" height="240"/>
  <text x="90" y="1135" class="section">3. Tenant + free trial</text>
  <rect class="boxTrial" x="500" y="1180" width="1400" height="110"/>
  <text x="1200" y="1230" text-anchor="middle" class="h">Tenant created | 14-day FREE trial starts</text>
  <text x="1200" y="1265" text-anchor="middle" class="small">NO card asked at signup | Full core features unlocked</text>

  <line class="line" x1="1200" y1="1330" x2="1200" y2="1410"/>

  <!-- 4 Dashboard -->
  <rect class="lane" x="60" y="1420" width="2280" height="1480"/>
  <text x="90" y="1465" class="section">4. Dashboard - how the app works</text>

  <rect class="boxDash" x="800" y="1500" width="800" height="80"/>
  <text x="1200" y="1550" text-anchor="middle" class="h">/dashboard</text>

  <line class="line" x1="1200" y1="1580" x2="1200" y2="1640"/>

  <rect class="box" x="140" y="1640" width="980" height="120"/>
  <text x="630" y="1690" text-anchor="middle" class="h">Integrations</text>
  <text x="630" y="1730" text-anchor="middle" class="small">WhatsApp | IG | Messenger | Site | Sheets | Mail</text>

  <rect class="box" x="1280" y="1640" width="980" height="120"/>
  <text x="1770" y="1690" text-anchor="middle" class="h">Knowledge</text>
  <text x="1770" y="1730" text-anchor="middle" class="small">FAQs + PDF uploads (AI answers from this only)</text>

  <path class="line" d="M1200,1640 H630"/>
  <path class="line" d="M1200,1640 H1770"/>
  <line class="line" x1="630" y1="1760" x2="630" y2="1840"/>
  <line class="line" x1="1770" y1="1760" x2="1770" y2="1840"/>
  <path class="line" d="M630,1840 H1200"/>
  <path class="line" d="M1770,1840 H1200"/>
  <line class="line" x1="1200" y1="1840" x2="1200" y2="1900"/>

  <rect class="boxDash" x="300" y="1900" width="1600" height="160"/>
  <text x="1200" y="1955" text-anchor="middle" class="h">Inbox - AI chats customers (ai_on)</text>
  <text x="1200" y="1995" text-anchor="middle" class="small">Q and A -&gt; order link -&gt; WA FINAL CONFIRM (summary + Do you confirm?) on order phone</text>
  <text x="1200" y="2030" text-anchor="middle" class="small">Customer YES -&gt; THEN add order row to Google Sheets (+ DB) -&gt; delivery tick -&gt; on the way -&gt; rating</text>

  <line class="line" x1="1200" y1="2060" x2="1200" y2="2140"/>

  <rect class="box" x="100" y="2140" width="500" height="120"/>
  <text x="350" y="2190" text-anchor="middle" class="h">Orders</text>
  <text x="350" y="2230" text-anchor="middle" class="small">Status ticks | delivery</text>

  <rect class="box" x="660" y="2140" width="500" height="120"/>
  <text x="910" y="2190" text-anchor="middle" class="h">Email</text>
  <text x="910" y="2230" text-anchor="middle" class="small">Important Gmail/Outlook</text>

  <rect class="box" x="1220" y="2140" width="500" height="120"/>
  <text x="1470" y="2190" text-anchor="middle" class="h">Alerts + Handover</text>
  <text x="1470" y="2230" text-anchor="middle" class="small">Stuck -&gt; pause thread | human reply</text>

  <rect class="box" x="1780" y="2140" width="500" height="120"/>
  <text x="2030" y="2190" text-anchor="middle" class="h">Assistant</text>
  <text x="2030" y="2230" text-anchor="middle" class="small">Owner to bot ops only</text>

  <path class="line" d="M1200,2140 H350"/>
  <path class="line" d="M1200,2140 H910"/>
  <path class="line" d="M1200,2140 H1470"/>
  <path class="line" d="M1200,2140 H2030"/>

  <rect class="box" x="140" y="2360" width="2120" height="160"/>
  <text x="1200" y="2415" text-anchor="middle" class="h">Order messaging lifecycle (detail)</text>
  <text x="1200" y="2455" text-anchor="middle" class="small">Ask product -&gt; knowledge -&gt; order link -&gt; site/chat order -&gt; WA final confirm (before Sheets) -&gt; YES</text>
  <text x="1200" y="2495" text-anchor="middle" class="small">THEN agent adds order details to Google Sheets (+ DB) -&gt; owner tick -&gt; on the way -&gt; received -&gt; rating</text>

  <line class="line" x1="350" y1="2260" x2="350" y2="2320"/>
  <path class="line" d="M350,2320 H1200"/>
  <line class="line" x1="1200" y1="2320" x2="1200" y2="2360"/>

  <rect class="box" x="200" y="2620" width="2000" height="120"/>
  <text x="1200" y="2670" text-anchor="middle" class="h">If AI stuck: pause ONLY that chat -&gt; notify owner (WhatsApp + Gmail + Alerts) -&gt; human reply</text>
  <text x="1200" y="2710" text-anchor="middle" class="small">Other chats stay ai_on | Assistant answers ops (e.g. important emails today) in Assistant thread</text>

  <line class="line" x1="1470" y1="2260" x2="1470" y2="2560"/>
  <path class="line" d="M1470,2560 H1200"/>
  <line class="line" x1="1200" y1="2560" x2="1200" y2="2620"/>
  <line class="line" x1="2030" y1="2260" x2="2030" y2="2560"/>
  <path class="line" d="M2030,2560 H1200"/>

  <line class="line" x1="1200" y1="2740" x2="1200" y2="2960"/>

  <!-- 5 Paywall -->
  <rect class="lane" x="60" y="2980" width="2280" height="680"/>
  <text x="90" y="3025" class="section">5. After 14 days</text>

  <rect class="boxPay" x="500" y="3080" width="1400" height="120"/>
  <text x="1200" y="3130" text-anchor="middle" class="h">Trial ends | ALL features BLOCKED</text>
  <text x="1200" y="3170" text-anchor="middle" class="small">Dashboard locked until payment</text>

  <line class="line" x1="1200" y1="3200" x2="1200" y2="3280"/>

  <rect class="boxPay" x="500" y="3280" width="1400" height="120"/>
  <text x="1200" y="3330" text-anchor="middle" class="h">Ask for card | Upgrade to Pro $10/mo</text>
  <text x="1200" y="3370" text-anchor="middle" class="small">No charge during trial | Money only after choosing Pro</text>

  <line class="line" x1="1200" y1="3400" x2="1200" y2="3480"/>

  <rect class="boxTrial" x="500" y="3480" width="1400" height="100"/>
  <text x="1200" y="3540" text-anchor="middle" class="h">Paid -&gt; features unlocked | continue using InboxShelf</text>

  <text x="1200" y="3720" text-anchor="middle" class="subtitle">InboxShelf | Target product flow | See also PRD + TRD</text>
</svg>
